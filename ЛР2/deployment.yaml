apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: web-app
          image: lab2-web-app:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5000
